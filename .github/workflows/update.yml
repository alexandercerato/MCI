name: Refresh public freight snapshots

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.py'
      - 'tests/**'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-public-freight-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source parsers, freshness and all estimator routes
        run: |
          node --test tests/source-parsers.test.js
          node tests/test-market-dates.cjs
          node tests/test-estimator.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - run: python update_data.py
      - name: Commit changed public snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json mcfi_history.csv raw_observations.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public freight snapshot"
            git push
          fi

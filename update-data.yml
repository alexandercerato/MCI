name: Update MCI data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public snapshot
        env:
          VESSELFINDER_API_KEY: ${{ secrets.VESSELFINDER_API_KEY }}
        run: python scripts/update_data.py
      - name: Commit changed snapshot
        run: |
          git config user.name "mci-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update MCI data snapshot"
          git push

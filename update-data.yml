name: Update Middle Corridor data

on:
  schedule:
    # Five minutes is GitHub Actions' minimum cron interval. Scheduled runs can
    # occasionally be delayed by GitHub; the dashboard never fabricates data.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mci-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - name: Commit verified data changes
        run: |
          git config user.name "middle-corridor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: verified public-source update"
          git push
